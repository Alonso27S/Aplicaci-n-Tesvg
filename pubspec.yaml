name: app_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.0.0
  mobile_scanner: ^5.0.0
  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4



flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/sounds/images/logo_tesvg.png"

  android: true

  

flutter_launcher_icons:
  android: true
  image_path: "assets/sounds/images/logo_tesvg.png"

flutter:

  uses-material-design: true

  assets:
    - "assets/sounds/ENTRADA.mp4"
    - "assets/sounds/REGISTRO.mp4"
    - "assets/sounds/ERROR.mp4"
    - "assets/sounds/NEGADO.mp4"
    - "assets/sounds/images/logo gobierno.png"
    - "assets/sounds/images/logo tecnm.png"
    - "assets/sounds/images/logo tesvg.png"
    - "assets/sounds/images/logo_tesvg.png"